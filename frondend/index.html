<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk - CampusCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<!-- dekorasi kiri -->
<svg class="deco l" viewBox="0 0 220 420" aria-hidden="true">
  <circle cx="46" cy="40" r="22" fill="#2b3a55"/><circle cx="50" cy="56" r="20" fill="#f1c9a5"/><path d="M30 42a22 18 0 0144 -2v-6a24 20 0 00-44 6z" fill="#1f2d3d"/>
  <path d="M0 110q30-30 60-10l30 30-10 20-30-20-30 40H0z" fill="#2c8a6e"/>
  <circle cx="130" cy="170" r="30" fill="#2c8a6e"/><path d="M130 154v32M114 170h32" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <path d="M175 235c-20-18-45-6-45 14 0 22 45 42 45 42s45-20 45-42c0-20-25-32-45-14z" fill="#f6b84a" transform="scale(.75) translate(75 70)"/>
  <circle cx="64" cy="300" r="26" fill="#1f2d3d"/><circle cx="68" cy="312" r="19" fill="#f1c9a5"/>
  <path d="M10 420c0-60 20-90 60-90s40 40 40 90z" fill="#2c8a6e"/><rect x="62" y="350" width="48" height="62" rx="5" fill="#1a3f72" transform="rotate(-8 86 380)"/>
  <circle cx="26" cy="236" r="4" fill="#1a3f72"/><path d="M180 390v18M171 399h18" stroke="#4b5b6b" stroke-width="2"/>
</svg>

<!-- dekorasi kanan -->
<svg class="deco r" viewBox="0 0 220 420" aria-hidden="true">
  <circle cx="170" cy="40" r="22" fill="#1f2d3d"/><circle cx="166" cy="56" r="19" fill="#f1c9a5"/>
  <path d="M220 100v110h-70l-30-30 20-20 30 20 10-60z" fill="#2c8a6e"/><rect x="170" y="150" width="50" height="34" rx="5" fill="#fff" stroke="#cfd8e3"/>
  <circle cx="30" cy="150" r="5" fill="none" stroke="#4b5b6b" stroke-width="2"/>
  <path d="M60 195c-18-16-40-5-40 12 0 20 40 38 40 38s40-18 40-38c0-17-22-28-40-12z" fill="#1a3f72"/><path d="M28 212h14l6-10 8 18 6-8h14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="60" cy="285" r="28" fill="#fff" stroke="#cfd8e3" stroke-width="2"/><path d="M60 270v30M45 285h30" stroke="#2c8a6e" stroke-width="9" stroke-linecap="round"/>
  <circle cx="150" cy="300" r="22" fill="#1f2d3d"/><circle cx="146" cy="312" r="19" fill="#f1c9a5"/>
  <path d="M100 420c0-70 30-95 62-95s58 40 58 95z" fill="#f6b84a"/><rect x="150" y="355" width="40" height="46" rx="5" fill="#fff" stroke="#cfd8e3"/>
  <circle cx="20" cy="405" r="5" fill="#9bb7d6"/>
</svg>

<main>
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v5"/></svg>
    </div>
    <div><b>CampusCare</b><span>Your Campus, Your Care</span></div>
  </div>

  <h1>Selamat Datang Kembali</h1>
  <p class="sub">Silakan masuk untuk mengakses layanan kesehatan dan aktivitas kampus Anda.</p>

  <form class="card" id="f" novalidate>
    <div class="help" role="note">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      Butuh bantuan masuk? Hubungi Layanan Mahasiswa.
    </div>

    <label for="id">NIM / Email</label>
    <div class="field">
      <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      <input type="text" id="id" name="id" autocomplete="username" placeholder="Contoh: mahasiswa@campus.ac.id" aria-describedby="e1">
      <p class="err" id="e1" role="alert"></p>
    </div>

    <label for="pw">Kata Sandi</label>
    <div class="field">
      <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      <input type="password" id="pw" name="pw" autocomplete="current-password" placeholder="Masukkan kata sandi Anda" aria-describedby="e2" autofocus>
      <button type="button" class="eye" id="eye" aria-label="Tampilkan kata sandi" aria-pressed="false">
        <svg id="eyeI" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0112 20C5 20 1 12 1 12a18.5 18.5 0 015.1-5.9M9.9 4.2A10.7 10.7 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 11-4.2-4.2"/></svg>
      </button>
      <p class="err" id="e2" role="alert"></p>
    </div>

    <div class="row">
      <label class="chk"><input type="checkbox" id="rm"><i></i>Ingat Saya</label>
      <a href="#" id="forgot">Lupa Kata Sandi?</a>
    </div>

    <button class="btn primary" type="submit" id="go">Masuk</button>
    <button class="btn sso" type="button" id="sso">Masuk dengan SSO Kampus</button>
    <div class="toast" id="t" role="status" aria-live="polite"></div>
  </form>

  <p class="foot">Belum memiliki akun? <a href="#" id="adm">Hubungi Unit Administrasi</a></p>
</main>

<script src="js/login.js"></script>
</body>
</html>
